authors = "Eric Evans"

["*growing*object*oriented*"]
title = "Growing Object-Oriented Software, Guided by Tests"
authors = "Steve Freeman, Nat Pryce"

["*eventstorming*"]
title = "Introducing EventStorming"
authors = "Alberto Brandolini"

["*refactoring*improving*1999*"]
