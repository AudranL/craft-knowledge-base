# Titres et auteurs corrigés à la main, prioritaires sur les métadonnées des fichiers.
# À copier à la racine du dossier d'ebooks, puis relancer `craft-kb ingest <dossier>`
# (les livres ne sont pas ré-extraits, seules les métadonnées changent).
#
# Chaque table est un nom de fichier ou un motif glob, insensible à la casse ;
# le premier motif qui correspond l'emporte.

["*clean*code*"]
title = "Clean Code: A Handbook of Agile Software Craftsmanship"
authors = "Robert C. Martin"

["*clean*architecture*"]
